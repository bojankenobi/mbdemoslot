<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="clock-rim" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="40%" stop-color="#fbc02d" />
      <stop offset="80%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#795548" />
    </radialGradient>
    <radialGradient id="clock-face" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#212129" />
      <stop offset="80%" stop-color="#121216" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
  </defs>
  
  <g>
    <!-- Outer bezel -->
    <circle cx="60" cy="60" r="50" fill="url(#clock-rim)" stroke="#ffe082" stroke-width="2"/>
    <!-- Black Dial -->
    <circle cx="60" cy="60" r="42" fill="url(#clock-face)" stroke="#fbc02d" stroke-width="1.5"/>
    
    <!-- Hour marks -->
    <line x1="60" y1="22" x2="60" y2="28" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="98" y1="60" x2="92" y2="60" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="98" x2="60" y2="92" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="60" x2="28" y2="60" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Hands pointing to ~11:58 (like in poster) -->
    <!-- Hour hand -->
    <line x1="60" y1="60" x2="57" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="60" y1="60" x2="60" y2="27" stroke="#ffd54f" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="3.5" fill="#f57f17" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>
