<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Rich 3D Horseshoe Gold Gradient -->
    <linearGradient id="horseshoeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fff099" />
      <stop offset="45%" stop-color="#f5c027" />
      <stop offset="75%" stop-color="#b88009" />
      <stop offset="100%" stop-color="#4a3000" />
    </linearGradient>

    <!-- Inner Bevel Dark Gold -->
    <linearGradient id="horseshoeInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2200" />
      <stop offset="50%" stop-color="#1f1100" />
      <stop offset="100%" stop-color="#0a0500" />
    </linearGradient>

    <!-- Nail Holes Silver / Steel Inset -->
    <linearGradient id="nailSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#383845" />
    </linearGradient>

    <filter id="horseshoeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffd700" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#horseshoeGlow)">
    <!-- Horseshoe Outer Curved Gold Body (facing up for luck) -->
    <path d="M 30 22 
             C 24 22, 16 34, 16 58 
             C 16 88, 38 106, 60 106 
             C 82 106, 104 88, 104 58 
             C 104 34, 96 22, 90 22 
             L 76 22 
             C 80 28, 82 40, 82 56 
             C 82 72, 72 84, 60 84 
             C 48 84, 38 72, 38 56 
             C 38 40, 40 28, 44 22 
             Z" 
          fill="url(#horseshoeGold)" stroke="#fffbe0" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Inner Groove / Channel in Gold -->
    <path d="M 32 28 
             C 28 34, 24 44, 24 58 
             C 24 82, 42 98, 60 98 
             C 78 98, 96 82, 96 58 
             C 96 44, 92 34, 88 28 
             L 80 28 
             C 84 36, 86 46, 86 58 
             C 86 76, 74 88, 60 88 
             C 46 88, 34 76, 34 58 
             C 34 46, 36 36, 40 28 
             Z" 
          fill="url(#horseshoeInner)" opacity="0.45" />

    <!-- Horseshoe End Calks (Tips) -->
    <rect x="27" y="19" width="18" height="6" rx="2" fill="url(#horseshoeGold)" stroke="#ffffff" stroke-width="0.8"/>
    <rect x="75" y="19" width="18" height="6" rx="2" fill="url(#horseshoeGold)" stroke="#ffffff" stroke-width="0.8"/>

    <!-- 6 Nail Holes (Square / Diamond studs for good fortune) -->
    <!-- Left Branch Nails -->
    <rect x="25" y="42" width="4.5" height="5" rx="1" fill="url(#nailSteel)" stroke="#ffe082" stroke-width="0.6"/>
    <rect x="24" y="58" width="4.5" height="5" rx="1" fill="url(#nailSteel)" stroke="#ffe082" stroke-width="0.6"/>
    <rect x="29" y="74" width="4.5" height="5" rx="1" fill="url(#nailSteel)" stroke="#ffe082" stroke-width="0.6"/>

    <!-- Right Branch Nails -->
    <rect x="90.5" y="42" width="4.5" height="5" rx="1" fill="url(#nailSteel)" stroke="#ffe082" stroke-width="0.6"/>
    <rect x="91.5" y="58" width="4.5" height="5" rx="1" fill="url(#nailSteel)" stroke="#ffe082" stroke-width="0.6"/>
    <rect x="86.5" y="74" width="4.5" height="5" rx="1" fill="url(#nailSteel)" stroke="#ffe082" stroke-width="0.6"/>

    <!-- Small Golden Star Emblem in bottom center -->
    <polygon points="60,90 62,94 67,94 63,97 65,101 60,98 55,101 57,97 53,94 58,94" fill="#ffffff" stroke="#ffd700" stroke-width="0.5"/>
  </g>
</svg>
